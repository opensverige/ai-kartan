# Det korta formuläret: tre fält, sedan skriver kartan posten. Tas emot av .github/workflows/tips.yml.
# Siffran först i filnamnet gör att mallen hamnar överst när någon väljer ärendetyp på GitHub.
# Rubrikerna läses av scripts/lib/tips.mjs. Ändras en rubrik här måste den ändras där också.
name: Lägg till en organisation
description: Tre fält. Vi skriver posten och svarar här i ärendet.
title: "Lägg till: "
labels: ["tips"]
body:
  - type: markdown
    attributes:
      value: |
        Tre saker räcker. Vi läser webbplatsen, skriver posten och svarar här inom 14 dagar. Tre kriterier gäller, inga andra: **svensk koppling**, **något byggt med AI bakom en publik länk** och **finns på riktigt**. Läs dem i [kriterier.md](../blob/main/kriterier.md).

        Lämna inga personuppgifter: inga namn, e-postadresser eller telefonnummer.
  - type: input
    id: namn
    attributes:
      label: Namn
      description: Så som organisationen kallar sig.
      placeholder: Exempelbolaget
    validations:
      required: true
  - type: input
    id: webbplats
    attributes:
      label: Webbplats
      placeholder: https://exempelbolaget.se
    validations:
      required: true
  - type: input
    id: belagg
    attributes:
      label: Länk till något ni byggt med AI
      description: En produkt, ett repo, en demo eller en publikation. Det får vara samma sida som webbplatsen om det syns där.
      placeholder: https://exempelbolaget.se/produkt
    validations:
      required: true
  - type: input
    id: organisationsnummer
    attributes:
      label: Organisationsnummer (valfritt)
      description: Formen 556000-0000. Med numret kan vi bekräfta uppgifter mot register direkt. Skriv aldrig numret för en enskild firma, eftersom det är ett personnummer.
      placeholder: 556000-0000
  - type: checkboxes
    id: enskild
    attributes:
      label: Enskild firma
      description: Enskilda firmor tar vi inte emot än, men det kommer. Kryssa i om det gäller dig, så hör vi av oss här när det öppnar.
      options:
        - label: Det gäller en enskild firma.

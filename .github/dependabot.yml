version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      beroenden:
        patterns: ["*"]
    labels: ["beroenden"]
    ignore:
      # @astrojs/check kräver TypeScript 5. Med TypeScript 7 går beroendena inte att installera.
      # Ta bort raden när Astros kontroll stöder den nya versionen.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels: ["beroenden"]

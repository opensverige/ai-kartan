# Ser till att kriterierna gås igenom av en människa innan en organisation går in på kartan.
#
# Varje pull request som rör en fil i data/organisationer får en kommentar med kriterierna per
# organisation. Läget "Granskning mot kriterierna" är gult tills varje punkt är avbockad och en
# människa med skrivrätt har skrivit /granskad i en egen kommentar. Görs läget tvingande för
# main går pull requesten inte att merga innan dess.
#
# Säkerhet:
#   - pull_request_target kör flödet och skripten ur main, aldrig ur pull requesten.
#     Pull requestens filer hämtas som data genom GitHubs API och körs aldrig.
#   - Inget ur pull requesten eller kommentarerna sätts in i ett skalkommando.
#   - Körningen minns ingenting. Varje gång räknar den ut läget på nytt: vilka organisationer som
#     ändras ur kodförrådets träd, vad som är avbockat ur flödets egen kommentar, och vem som har
#     intygat ur kommentarerna. Vilken händelse som startade körningen spelar ingen roll, så en
#     körning som uteblir eller hoppas över kan inte ge grönt.
#   - En bock gäller filens version. Ändras filen nollställs bocken.
#   - Rutorna kan kryssas i av vem som helst med skrivrätt, även en bot. Därför krävs intyget:
#     en kommentar som ingen har redigerat, skriven av en människa med skrivrätt efter listans
#     senaste ändring.
#
# Flödet heter något annat än läget med flit. Den gröna bocken för själva körningen ska inte
# gå att förväxla med läget, som är det som ska göras tvingande.
name: Granskningslista

on:
  pull_request_target:
    # edited täcker att pull requesten byter basgren, till exempel till main.
    types: [opened, synchronize, reopened, ready_for_review, edited]
    branches: [main]
  issue_comment:
    types: [created, edited, deleted]
  # För pull requests som inte startar flödet av sig själva: de som skapas ur ärendeformuläret
  # och de som var öppna innan flödet fanns. Ange pull requestens nummer.
  workflow_dispatch:
    inputs:
      pr:
        description: Pull requestens nummer
        required: true
        type: number

permissions: {}

# En körning i taget per pull request. Väntar redan en körning ersätts den av en nyare, och det
# är rätt: varje körning räknar om allt, så den senaste räcker. En kommentar som inte rör
# granskningen får en egen grupp, så att den inte tränger undan en körning som behövs.
#
# En kommentar rör granskningen om den sitter på en pull request och antingen är flödets egen
# lista eller nämner /granskad, nu eller innan den redigerades. Vem som skrev den prövas i
# skriptet: GitHub säger inte alltid här att någon hör till organisationen. Samma villkor står på
# jobbet nedan.
concurrency:
  group: granskning-${{ (github.event_name != 'issue_comment' || (github.event.issue.pull_request != null && (github.event.comment.user.login == 'github-actions[bot]' || contains(github.event.comment.body, '/granskad') || contains(github.event.changes.body.from, '/granskad')))) && (github.event.pull_request.number || github.event.issue.number || inputs.pr) || github.run_id }}

jobs:
  granskning:
    name: Skriv listan och sätt läget
    if: github.event_name != 'issue_comment' || (github.event.issue.pull_request != null && (github.event.comment.user.login == 'github-actions[bot]' || contains(github.event.comment.body, '/granskad') || contains(github.event.changes.body.from, '/granskad')))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      statuses: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Skriv listan och sätt läget
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMMER: ${{ github.event.pull_request.number || github.event.issue.number || inputs.pr }}
        run: node scripts/granskning.mjs

# Mall för en ny organisation på AI-kartan.
#
# Kopiera filen till data/organisationer/<id>.yaml, där <id> är ett permanent slug-namn
# med små bokstäver, siffror och bindestreck (t.ex. berget-ai). Ta bort kommentarerna om du vill.
#
# Varje uppgift bär sin egen källa, sitt datum och sin status:
#   confirmed  = bekräftad mot register, myndighet eller oberoende dokument
#   claimed    = egen uppgift: organisationens webbplats, dokument eller eget bidrag
#   planned    = uttalat mål, inte uppnått
#   unknown    = inte undersökt (värdet lämnas som null)
# Källtyper: company_register, regulator, third_party, academic, infra_dataset,
#            own_site, own_docs, press, self_submitted
# Egen webbplats och eget bidrag ger högst status "claimed". Det är inte ett betyg,
# bara en ärlig markering av var uppgiften kommer ifrån.
#
# Schemat har inga fält för kontaktpersoner, anställda eller e-post. Lägg inte till sådana.
# Enskilda firmor läggs bara till av personen själv (self_submitted: true) och får ingen exakt position.

